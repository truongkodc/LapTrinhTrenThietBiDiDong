name: fitplan_hutech
description: "Ứng dụng Lập kế hoạch Tập thể dục - Đồ án HUTECH"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management (Bài 7)
  provider: ^6.1.5+1

  # Local Storage (Bài 6 P1)
  shared_preferences: ^2.5.6

  # SQLite Database (Bài 6 P1)
  sqflite: ^2.4.2
  path: ^1.9.1

  # HTTP Networking (Bài 6 P1)
  http: ^1.4.0

  # Firebase Authentication (Bài 6 P2)
  firebase_core: ^3.13.0
  firebase_auth: ^5.7.0

  # Date Formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
